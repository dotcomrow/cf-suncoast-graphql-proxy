name: Initial create workflow

on:
  push:

permissions: write-all

jobs:
  deploy:
    env:
      TF_CLOUD_ORGANIZATION: ${{ github.repository_owner }}
      TF_API_TOKEN: ${{ secrets.TFE_TOKEN }}
    name: "Build and Deploy"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Get next version
        uses: reecetech/version-increment@a29aa752dc3b8118a2dc2ed93faf0e95a73a9c7e
        id: version
        with:
          scheme: calver
          increment: patch

      - name: Lookup Project ID
        id: lookup_project_id
        run: |
            curl \
            --header "Authorization: Bearer ${{ secrets.TFE_TOKEN }}" \
            --header "Content-Type: application/vnd.api+json" \
            --request GET \
            --output project_output.txt \
            https://app.terraform.io/api/v2/organizations/${{ github.repository_owner }}/projects
            echo "project_id=$(jq -r --arg name '${{ vars.TFE_PROJECT }}' '.data[] | select(.attributes.name | test($name; "i")) | .id' project_output.txt)" >> $GITHUB_OUTPUT

      - name: Create Release branch
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f
        with:
          branch: release # The branch the action should deploy to.
          folder: . # The folder the action should deploy.

      - name: Checkout Release branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: release
          path: release

      - name: Build
        run: |
          cd release
          npm install
          npm run build

      - name: Commit
        run: |
            cd release
            git config --global user.name "${{ github.actor }}"
            git config --global user.email "${{ github.actor }}@users.noreply.github.com"
            git add .
            git commit -m "Release ${{ steps.version.outputs.version }}"
            git push

      - name: Create workspace
        id: create_workspace_dev
        run: |
              cat > payload.json <<EOF
              {
                "data": {
                  "attributes": {
                    "name": "${{ github.event.repository.name }}-dev",
                    "auto-apply": "true"
                  },
                  "type": "workspaces",
                  "relationships": {
                    "project": {
                      "data": {
                        "type": "projects",
                        "id": "${{ steps.lookup_project_id.outputs.project_id }}"
                      }
                    }
                  }
                }
              }
              EOF
              curl \
              --header "Authorization: Bearer ${{ secrets.TFE_TOKEN }}" \
              --header "Content-Type: application/vnd.api+json" \
              --request POST \
              --data @payload.json \
              --output output.txt \
              https://app.terraform.io/api/v2/organizations/${{ github.repository_owner }}/workspaces
              echo "workspace_id=$(cat output.txt | jq -r '.[].id')" >> $GITHUB_OUTPUT

      - name: Create workspace
        id: create_workspace_prod
        run: |
          cat > payload.json <<EOF
          {
            "data": {
              "attributes": {
                "name": "${{ github.event.repository.name }}-prod",
                "auto-apply": "true"
              },
              "type": "workspaces",
              "relationships": {
                "project": {
                  "data": {
                    "type": "projects",
                    "id": "${{ steps.lookup_project_id.outputs.project_id }}"
                  }
                }
              }
            }
          }
          EOF
          curl \
          --header "Authorization: Bearer ${{ secrets.TFE_TOKEN }}" \
          --header "Content-Type: application/vnd.api+json" \
          --request POST \
          --data @payload.json \
          --output output.txt \
          https://app.terraform.io/api/v2/organizations/${{ github.repository_owner }}/workspaces
          echo "workspace_id=$(cat output.txt | jq -r '.[].id')" >> $GITHUB_OUTPUT

      - name: Create workspace variables dev
        run: |
          cat > payload.json <<EOF
          {
            "data": {
              "type":"vars",
              "attributes": {
                "key":"project_name",
                "value":"${{ github.event.repository.name }}",
                "description":"project name",
                "category":"terraform",
                "hcl":false,
                "sensitive":false
              },
              "relationships": {
                "workspace": {
                  "data": {
                    "id":"${{ steps.create_workspace_dev.outputs.workspace_id }}",
                    "type":"workspaces"
                  }
                }
              }
            }
          }
          EOF
          curl \
          --header "Authorization: Bearer ${{ secrets.TFE_TOKEN }}" \
          --header "Content-Type: application/vnd.api+json" \
          --request POST \
          --data @payload.json \
          https://app.terraform.io/api/v2/vars

          cat > payload.json <<EOF
          {
            "data": {
              "type":"vars",
              "attributes": {
                "key":"environment",
                "value":"dev",
                "description":"organization name",
                "category":"terraform",
                "hcl":false,
                "sensitive":false
              },
              "relationships": {
                "workspace": {
                  "data": {
                    "id":"${{ steps.create_workspace_dev.outputs.workspace_id }}",
                    "type":"workspaces"
                  }
                }
              }
            }
          }
          EOF
          curl \
          --header "Authorization: Bearer ${{ secrets.TFE_TOKEN }}" \
          --header "Content-Type: application/vnd.api+json" \
          --request POST \
          --data @payload.json \
          https://app.terraform.io/api/v2/vars

          cat > payload.json <<EOF
          {
            "data": {
              "type":"vars",
              "attributes": {
                "key":"VERSION",
                "value":"${{ steps.version.outputs.version }}",
                "description":"code version",
                "category":"terraform",
                "hcl":false,
                "sensitive":false
              },
              "relationships": {
                "workspace": {
                  "data": {
                    "id":"${{ steps.create_workspace_dev.outputs.workspace_id }}",
                    "type":"workspaces"
                  }
                }
              }
            }
          }
          EOF
          curl \
          --header "Authorization: Bearer ${{ secrets.TFE_TOKEN }}" \
          --header "Content-Type: application/vnd.api+json" \
          --request POST \
          --data @payload.json \
          https://app.terraform.io/api/v2/vars

      - name: Create workspace variables prod
        run: |
            cat > payload.json <<EOF
            {
              "data": {
                "type":"vars",
                "attributes": {
                  "key":"project_name",
                  "value":"${{ github.event.repository.name }}",
                  "description":"project name",
                  "category":"terraform",
                  "hcl":false,
                  "sensitive":false
                },
                "relationships": {
                  "workspace": {
                    "data": {
                      "id":"${{ steps.create_workspace_prod.outputs.workspace_id }}",
                      "type":"workspaces"
                    }
                  }
                }
              }
            }
            EOF
            curl \
            --header "Authorization: Bearer ${{ secrets.TFE_TOKEN }}" \
            --header "Content-Type: application/vnd.api+json" \
            --request POST \
            --data @payload.json \
            https://app.terraform.io/api/v2/vars
  
            cat > payload.json <<EOF
            {
              "data": {
                "type":"vars",
                "attributes": {
                  "key":"environment",
                  "value":"prod",
                  "description":"organization name",
                  "category":"terraform",
                  "hcl":false,
                  "sensitive":false
                },
                "relationships": {
                  "workspace": {
                    "data": {
                      "id":"${{ steps.create_workspace_prod.outputs.workspace_id }}",
                      "type":"workspaces"
                    }
                  }
                }
              }
            }
            EOF
            curl \
            --header "Authorization: Bearer ${{ secrets.TFE_TOKEN }}" \
            --header "Content-Type: application/vnd.api+json" \
            --request POST \
            --data @payload.json \
            https://app.terraform.io/api/v2/vars

            cat > payload.json <<EOF
            {
              "data": {
                "type":"vars",
                "attributes": {
                  "key":"VERSION",
                  "value":"${{ steps.version.outputs.version }}",
                  "description":"code version",
                  "category":"terraform",
                  "hcl":false,
                  "sensitive":false
                },
                "relationships": {
                  "workspace": {
                    "data": {
                      "id":"${{ steps.create_workspace_prod.outputs.workspace_id }}",
                      "type":"workspaces"
                    }
                  }
                }
              }
            }
            EOF
            curl \
            --header "Authorization: Bearer ${{ secrets.TFE_TOKEN }}" \
            --header "Content-Type: application/vnd.api+json" \
            --request POST \
            --data @payload.json \
            https://app.terraform.io/api/v2/vars

      - uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661
        id: upload_dev
        with:
          workspace: ${{ github.event.repository.name }}-dev
          directory: release

      - uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661
        id: upload_prod
        with:
          workspace: ${{ github.event.repository.name }}-prod
          directory: release

      - name: Create Apply Run dev
        uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661
        id: apply-run-dev
        if: success() || failure()
        with:
          workspace: ${{ github.event.repository.name }}-dev
          configuration_version: ${{ steps.upload_dev.outputs.configuration_version_id }}
          plan_only: false

      - name: Create Apply Run prod
        uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661
        id: apply-run-prod
        if: success() || failure()
        with:
          workspace: ${{ github.event.repository.name }}-prod
          configuration_version: ${{ steps.upload_prod.outputs.configuration_version_id }}
          plan_only: false

      - name: Disable initial workflow
        run: |
          gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/actions/workflows/initial-deploy.yml/disable
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_COMMITISH: release
        with:
          github-token: "${{ github.token }}"
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = `${process.env.VERSION}-initial`;
            const targetCommitish = process.env.TARGET_COMMITISH;

            let existingRelease = null;

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag
              });
              existingRelease = existing.data;
              core.info(`Release for tag '${tag}' already exists (id=${existingRelease.id}). Skipping create.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            if (!existingRelease) {
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: targetCommitish,
                name: process.env.VERSION,
                draft: false,
                prerelease: false,
                generate_release_notes: true
              });
              existingRelease = created.data;
              core.info(`Created release id=${existingRelease.id} for tag '${tag}'.`);
            }

            core.exportVariable('RELEASE_ID', String(existingRelease.id));
            core.exportVariable('RELEASE_UPLOAD_URL', existingRelease.upload_url);

      - name: Delete release branch
        continue-on-error: true
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config pull.rebase true
          resp=`git ls-remote --heads origin release | wc -m | sed 's/ //g'`
          if [ $resp -gt 0 ]; then
            git push origin --delete release
          fi
